[project]
name = "falcon-oas"
version = "2024.11.05-rc1"
description = "Design first approach with OpenAPI 3 for Falcon"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "falcon>=3.1.3,<4",
    "jsonref>=1.1.0,<2.0",
    "jsonschema>=4.23.0,<4.24",
    "pyrfc3339>=2.0.1,<2.1",
    "pyyaml>=6.0.2,<7",
    "rfc3986>=2.0.0,<2.1",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3,<9",
]

