[metadata]
name = falcon-oas
description = Design first approach with OpenAPI 3 for Falcon
long_description = file: README.rst
url = https://github.com/grktsh/falcon-oas
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12

[options]
packages = find:
package_dir =
    = src
install_requires =
    falcon >= 3.1.3
    jsonref >= 1.1.0
    jsonschema >= 4.23.0
    pyrfc3339 >= 2.0.1
    pyyaml >= 6.0.2
    rfc3986 >= 2.0.0

[options.extras_require]
test =
    pytest
    pytest-cov
    pytest-mock
    pytest-xdist
    pyyaml ~= 6.0

[options.packages.find]
where = src

[bdist_wheel]
universal = 1

[coverage:run]
branch = True
parallel = True
source =
    falcon_oas

[coverage:paths]
source =
    src
    */site-packages

[coverage:report]
show_missing = True

[tool:pytest]
testpaths = tests

[flake8]
ignore =
    E501
    E203
    W503
